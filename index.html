<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人微信收款</title>
<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg,#07c160 0%,#05a94f 45%,#f5f5f5 45%);
    font-family:"Microsoft YaHei",Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}
.card{
    width:360px;
    background:#fff;
    border-radius:24px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}
.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    margin-top:-70px;
    object-fit:cover;
    border:5px solid white;
}
h1{
    margin:15px 0 8px;
    font-size:26px;
    color:#333;
}
.sub{
    color:#888;
    font-size:15px;
    margin-bottom:25px;
}
.qrcode{
    width:290px;
    max-width:100%;
    border-radius:8px;
}
.tip{
    margin-top:20px;
    font-size:18px;
    color:#07c160;
    font-weight:bold;
}
.footer{
    margin-top:15px;
    color:#999;
    font-size:13px;
}
</style>
</head>

<body>
<div class="card">

<h1>微信收款</h1>
<div class="sub">感谢您的支持</div>

<img class="qrcode" src="wechat_pay.jpg" alt="微信收款二维码">

<div class="tip">扫一扫付款</div>
<div class="footer">个人收款码 · 安全快捷</div>

</div>
</body>
</html>
